[package]
name = "coven-scout"
version = "0.1.0"
edition = "2021"
description = "A fast, safe MCP server for filesystem and web operations — built for the Coven ecosystem"
license = "MIT"
repository = "https://github.com/OpenCoven/coven-scout"

[[bin]]
name = "coven-scout"
path = "src/main.rs"

[lib]
name = "coven_scout"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = "2"
tar = "0.4"
flate2 = "1"
glob = "0.3"
mime_guess = "2"
similar = { version = "2", features = ["text"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
htmd = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
shellexpand = "3"
regex = "1"
base64 = "0.22"
bytes = "1.11.1"
